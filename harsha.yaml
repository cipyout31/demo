apiVersion: apps/v1
kind: Deployment
metadata:
  name: harsha
spec:
  selector:
    matchLabels:
      app: harsha
  replicas: 1
  template:
    metadata:
      labels:
        app: harsha
    spec:
      containers:
        - name: harsha
          image: cipyout31/harsha:v1  # Will be dynamically updated by Jenkins
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: harsha-service
spec:
  type: NodePort
  selector:
    app: harsha
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30000