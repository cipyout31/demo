apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-spring-boot
spec:
  selector:
    matchLabels:
      app: admin-spring-boot
  replicas: 1
  template:
    metadata:
      labels:
        app: admin-spring-boot
    spec:
      containers:
        - name: admin
          image: cipyout31/harsha:v1  # Replace with your actual image name
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
spec:
  type: NodePort
  selector:
    app: admin-spring-boot
  ports:
    - protocol: TCP
      port: 8080          # Port exposed inside the cluster
      targetPort: 8080    # Port your Spring Boot app listens on
      nodePort: 30000     # External port on your node